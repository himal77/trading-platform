name: trading-platform

services:

  # ---------- Data layer ----------

  postgres:
    image: postgres:16-alpine
    container_name: tp-postgres
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka in KRaft mode — no Zookeeper needed
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: tp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tp-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- Application services ----------

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: tp-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: trading
      DB_PASSWORD: trading
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-256-bits-long-for-hs256-algorithm}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["services"]

  wallet-service:
    build:
      context: ..
      dockerfile: services/wallet-service/Dockerfile
    container_name: tp-wallet-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet_db
      DB_USER: trading
      DB_PASSWORD: trading
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  trade-service:
    build:
      context: ..
      dockerfile: services/trade-service/Dockerfile
    container_name: tp-trade-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trade_db
      DB_USER: trading
      DB_PASSWORD: trading
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    container_name: tp-order-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USER: trading
      DB_PASSWORD: trading
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: tp-notification-service
    ports:
      - "8085:8085"
    environment:
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-256-bits-long-for-hs256-algorithm}
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["services"]

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: tp-api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-256-bits-long-for-hs256-algorithm}
      AUTH_SERVICE_URL: http://auth-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      TRADE_SERVICE_URL: http://trade-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["services"]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
