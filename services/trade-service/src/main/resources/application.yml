server:
  port: 8083

spring:
  application:
    name: trade-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trade_db}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: trade-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Resilience stack for outbound calls: Bulkhead -> Circuit Breaker -> Retry -> call -> Timeout
resilience4j:
  circuitbreaker:
    instances:
      paymentProvider:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 20
  retry:
    instances:
      paymentProvider:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
  bulkhead:
    instances:
      paymentProvider:
        maxConcurrentCalls: 20
  timelimiter:
    instances:
      paymentProvider:
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.tradingplatform: DEBUG
